function computeProfile(events, upToTime) {

  for (const e of active) {

      kills++;
      if (e.data.playerWasKiller || e.data.playerUnitKill) playerKills++;
      if (e.data.playerWasVictim) deaths++;
      if (pathogenTypes.has(e.data.killerType)) teamKills++;
    }
    if (e.type === "SwitchEvent") {
      switches++;
      if (e.data.toUnitType) uniqueUnits.add(e.data.toUnitType);
    }
    if (e.type === "ControlStateEvent") {
      ctrlTransitions++;
      if (e.data.toState === "Disabled" && e.data.trigger === "NodeDock") docks++;
    }
    if (e.type === "AbilityEvent") {
      abilities++;
      const ab = e.data.ability || "";
      if (ab.includes("Waypoint") || ab.includes("AutoDock")) waypoints++;
      if (ab === "Replicate") replicates++;
      if (ab === "Emit") emits++;
    }
    if (e.type === "NodeCaptureEvent") {
      captures++;
      if (e.data.playerInvolved) playerCaptures++;
    }
    if (e.type === "ViewEvent" && e.data.zoomLevel != null) {
      zooms.push(e.data.zoomLevel);
      if (lastZoom !== null && Math.abs(e.data.zoomLevel - lastZoom) > 20) zoomChanges++;
      lastZoom = e.data.zoomLevel;
    }
  }
  const elapsed = Math.max(upToTime, 1);
  const avgZoom = zooms.length ? zooms.reduce((a, b) => a + b, 0) / zooms.length : 150;
  return {
    reactivity: Math.min(100, playerKills / elapsed * 200 + (deaths > 0 ? 5 : 0)),

// classifyEvent: returns [{id, layer, weight}, ...] with multi-layer signal routing
// Events emit primary (1.0) and secondary (0.2-0.5) signals to reflect parallel processing
function classifyEvent(e) {
  const signals = [];
  if (e.type === "CombatEvent") {
    if (e.data.playerWasKiller || e.data.playerUnitKill) {
      signals.push({
        id: "ev_kill",
        layer: "L1",
        weight: 1.0
      }); // reactive execution
      signals.push({
        id: "ev_kill",
        layer: "L2",
        weight: 0.3
      }); // target selection pattern
    }
    if (e.data.playerWasVictim) {
      signals.push({
        id: "ev_death",
        layer: "L1",
        weight: 1.0
      }); // reactive failure
      signals.push({
        id: "ev_death",
        layer: "L4",
        weight: 0.4
      }); // "what went wrong?" metacog
    }
    // World deaths — units dying around the player, strategic awareness
    if (!e.data.playerWasKiller && !e.data.playerUnitKill && !e.data.playerWasVictim) {
      signals.push({
        id: "ev_worldDeath",
        layer: "L3",
        weight: 1.0
      }); // battlefield awareness
      signals.push({
        id: "ev_worldDeath",
        layer: "L4",
        weight: 0.8
      }); // attrition strategy
    }
  }
  if (e.type === "ViewEvent") {
    const z = e.data.zoomLevel;
    if (z < 150) {
      signals.push({
        id: "ev_zoomIn",
        layer: "L1",
        weight: 1.0
      }); // tactical focus
      signals.push({
        id: "ev_zoomIn",
        layer: "L2",
        weight: 0.2
      }); // spatial awareness
    } else if (z > 200) {
      signals.push({

        killSplashes.push({
          x: c[1],

        });

    }
    // Player position from trajectory
    let playerPos = null;
    for (const t2 of trajectory) {
      if (t2[0] > dataTime) break;

        x: t2[1],
        z: t2[2],
        type: t2[3]

    }
    // ═══ NODE OWNERSHIP STATE ═══
    // Track which team owns each node at current time
    const nodeOwnership = {}; // nodeName → team (1=pathogen, 2=immune)
    // Base nodes start with their teams
    nodeOwnership["Base2Node"] = 1; // pathogen base starts infected
    nodeOwnership["Base1Node"] = 2; // immune base starts clean
    const nodeCaptures = treeSession === "commander" ? CMD_NODE_CAPTURES : IMM_NODE_CAPTURES;
    for (const c of nodeCaptures) {
      if (c[0] > dataTime) break;
      nodeOwnership[c[1]] = c[2]; // [time, nodeName, capturedByTeam, playerInvolved]
    }
    // Switch events for CELLS input node
    const treeEventsUpToNow = treeEvents.filter(e => e.t <= dataTime);
    for (const e of treeEventsUpToNow) {
      if (e.type === "SwitchEvent") {
        inputNodeFire.teamPop = e.t;
        inputNodeFire.nodeOwner = e.t;
      }
    }
    // ═══ GATED FIREHOSE — only flicker channels with recent real data ═══
    if (time > 0.1 && COL_RAMP.data > 0) {
      FIREHOSE_KEYS.forEach((key, i) => {
        const lastReal = inputNodeFire[key] !== undefined ? inputNodeFire[key] : -999;
        const realAge = time - lastReal;
        if (realAge > FIREHOSE_RECENCY) return; // channel is stale — go genuinely dark
        const cycle = Math.floor(nowMs / PRIMES[i % PRIMES.length]);
        if (cycle % 7 < 5) firehoseSet.add(key);
      });
    }
    // Population by interval (10s bins): estimate total alive per side
    const POP_BIN = 10;
    const BASE_POP = 25;
    const popBins = [];
    const maxBins = Math.ceil(time / POP_BIN);
    let pathDeaths = 0,
      immDeaths = 0;
    for (let b = 0; b < maxBins; b++) {

      const t1 = Math.min(t0 + POP_BIN, time);
      for (const c of combatDetail) {

        if (PATHOGEN_ABBR.has(c[4])) pathDeaths++;
        if (IMMUNE_ABBR.has(c[4])) immDeaths++;
      }
      popBins.push({
        t0,
        pathPop: Math.max(0, BASE_POP - pathDeaths),
        immPop: Math.max(0, BASE_POP - immDeaths)
      });
    }

    // Input label nodes — 22 individual data channels for christmas tree firehose
    const INPUT_NODES = [
    // (UNIT now embedded inside HUD container)

    {

    const inputNodeH = 14; // half game event height (28/2)

    // v30: eventToBoxIds removed — was only used by legacy synapse system

    // Helper: get best fire time for a box (max across its raw types)
    const getBoxFireTime = box => {
      const types = box.rawTypes || [box.id];
      return Math.max(...types.map(t => rawLastFire[t] || -999));
    };
    const getBoxHotTime = box => {
      const types = box.rawTypes || [box.id];

    // Event stream: classified events
    const rawEvents = dataTime < 0.2 ? [] : treeEvents.filter(e => e.t <= dataTime).slice(-14);

    // Compute live-brightness floor from treeActivation (matches mid-playback look)
    const maxEventCount = Math.max(1, ...Object.values(treeActivation.activeCounts || {}));
    const getLiveFinalFloor = (id, type) => {
      if (dataTime < 2) return 0;
      if (type === "event") {
        const c = treeActivation.activeCounts[id] || 0;
        if (id === "ev_worldDeath") return Math.min(0.85, c * 0.012);
        return c > 0 ? Math.max(0.15, Math.min(0.85, Math.sqrt(c / maxEventCount))) : 0;
      }
      if (type === "skill") {
        // Skills lit proportional to their sub-skill fire counts
        const c = treeActivation.activeCounts[id] || 0;
        return c > 0 ? Math.max(0.2, Math.min(0.75, c / maxEventCount * 3)) : 0;
      }
      if (type === "layer") return treeActivation.layerStrength[id] || 0;
      if (type === "profile") return treeActivation.profileStrength[id] || 0;
      if (type === "career") return treeActivation.careerStrength[id] || 0;
      return 0;
    };

    // ═══ getNodeIntensity — reads from unified nodeBright map ═══
    const getNodeIntensity = (id, type) => nodeBright[id] || 0;
    const isBlinking = id => {
      const last = treeActivation.lastActivated[id];
      if (last === undefined) return false;
      const age = time - last;
      return age > 0 && age < BLINK_WINDOW && COL_RAMP.input > 0;
    };

    // ═══ FORWARD PROPAGATION MODEL ═══
    // Signal travels left→right with real delay per column transition.
    // An event firing at t=5.0 reaches layers at t+0.3, profiles at t+0.6, careers at t+0.9
    const PROP_DELAY = 0.5; // seconds per column transition (ramps handle cascade timing)
    const PROP_DECAY = 1.2; // seconds for propagation wavefront to fade
    // Layer speed ratios relative to L1: L2 half speed, L3 third, L4 fifth
    const LAYER_SPEED = {
      L1: 2.0,
      L2: 0.5,
      L3: 0.3,
      L4: 0.2
    };
    const getLayerDelay = toId => PROP_DELAY / (LAYER_SPEED[toId] || 1.0);

    // Build propagation timeline: for each node, when did a propagation wavefront last arrive?
    const propArrival = {}; // nodeId → latest arrival time
    // Seed: event nodes fire at their actual event time
    rawEvents.forEach(e => {
      const signals = classifyEvent(e);
      signals.forEach(s => {
        if (s.id.startsWith("ev_")) {
          propArrival[s.id] = Math.max(propArrival[s.id] || -999, e.t);
        }
      });
    });
    // ═══ EVENT NODE SEEDING — sparse bursts from raw inputs ═══
    // Event nodes fire from classified events (sporadic) + periodic raw input bursts
    // Sparse seeding = edges flash on/off instead of staying constantly lit
    // Burst every ~0.6s game-time keeps L1 pathway flashing rapidly
    const RAW_BURST_INTERVAL = 0.6; // seconds between raw-input bursts
    const RAW_BURST_DURATION = 0.25; // how long each burst lasts
    for (const r of rawInputs) {
      if (r.t > dataTime) break;
      // Only seed during burst windows
      const burstPhase = r.t % RAW_BURST_INTERVAL;
      if (burstPhase > RAW_BURST_DURATION) continue;
      if (r.type === "mouse") {
        propArrival["ev_mouseFollow"] = Math.max(propArrival["ev_mouseFollow"] || -999, r.t);
        propArrival["ev_midSwitch"] = Math.max(propArrival["ev_midSwitch"] || -999, r.t);
      }
      if (r.type === "key") {
        const d = r.data || "";
        if (d.includes("W") || d.includes("A") || d.includes("S") || d.includes("D")) {
          propArrival["ev_wasd"] = Math.max(propArrival["ev_wasd"] || -999, r.t);
        }
        if (d === "R" || d.includes("R")) propArrival["ev_replicate"] = Math.max(propArrival["ev_replicate"] || -999, r.t);
        if (d === "E" || d.includes("E")) propArrival["ev_emit"] = Math.max(propArrival["ev_emit"] || -999, r.t);
        if (d === "SPC" || d.includes("SPC")) propArrival["ev_dock"] = Math.max(propArrival["ev_dock"] || -999, r.t);
      }
      if (r.type === "click") {
        propArrival["ev_kill"] = Math.max(propArrival["ev_kill"] || -999, r.t);
      }
      if (r.type === "scroll") {
        propArrival["ev_zoomIn"] = Math.max(propArrival["ev_zoomIn"] || -999, r.t);
        propArrival["ev_zoomOut"] = Math.max(propArrival["ev_zoomOut"] || -999, r.t);
      }
      if (r.type === "world") {
        propArrival["ev_nearSwitch"] = Math.max(propArrival["ev_nearSwitch"] || -999, r.t);
        propArrival["ev_worldDeath"] = Math.max(propArrival["ev_worldDeath"] || -999, r.t);
      }
    }
    // Propagate through edge layers with per-target delay
    const propagateThrough = (edges, delayFn) => {
      edges.forEach(edge => {
        const fromId = edge[0],
          toId = edge[1],
          w = edge[2] || 1.0;
        if (w < 0.3) return;
        const fromArrival = propArrival[fromId];
        if (fromArrival === undefined || fromArrival < -900) return;
        const delay = typeof delayFn === "function" ? delayFn(toId) : delayFn;
        const toArrival = fromArrival + delay;
        if (toArrival <= dataTime) {
          propArrival[toId] = Math.max(propArrival[toId] || -999, toArrival);
        }
      });
    };
    propagateThrough(EVENT_SUBSKILL_EDGES, PROP_DELAY * 2.0); // event → sub-skill (visible cascade delay)
    propagateThrough(EVENT_SKILL_EDGES, PROP_DELAY * 2.5); // event → parent cell
    propagateThrough(SUBSKILL_LAYER_EDGES, getLayerDelay); // skill→layer (replaces direct event→layer)
    propagateThrough(LAYER_PROFILE_EDGES, PROP_DELAY);
    propagateThrough(PROFILE_CAREER_EDGES, PROP_DELAY);

    // Get propagation intensity: how recently did the wavefront arrive at this node?
    const HEAVY_EVENTS = new Set(["ev_emit", "ev_replicate", "ev_zoomOut", "ev_zoomIn", "ev_dock"]);
    // (getPropIntensity removed — unified brightness pipeline)

    // Edge propagation: edge lights up ONLY when wavefront is traversing it
    // (getEdgePropIntensity removed — unified brightness pipeline)

    // ═══ CUMULATIVE EDGE FIRE TRACKING — "baking in" trails ═══
    // Count how many times each edge path has been activated
    // This creates permanent visual weight on frequently-used pathways
    const edgeFireCounts = {}; // "fromId:toId" → weighted count
    rawEvents.forEach(e => {
      const signals = classifyEvent(e);
      signals.forEach(s => {
        // Count channel→event fires, weighted by signal importance
        const evId = s.id;
        const layerId = s.layer;
        if (evId && layerId) {
          const importance = SIGNAL_IMPORTANCE[evId] || 1.0;
          const k1 = `${evId}:${layerId}`;
          edgeFireCounts[k1] = (edgeFireCounts[k1] || 0) + s.weight * importance;
        }
        // Count source channel activations → event (also importance-weighted)
        if (evId && evId.startsWith("ev_")) {
          const importance = SIGNAL_IMPORTANCE[evId] || 1.0;
          for (const df of DERIVED_FEATURES) {
            if (df.feeds.includes(evId)) {
              for (const src of df.sources) {
                const k2 = `${src}:${evId}`;
                edgeFireCounts[k2] = (edgeFireCounts[k2] || 0) + 0.5 * importance;
              }
            }
          }
        }
      });
    });
    // Find the max fire count for normalization
    // ─── CHANNEL → DERIVED FEATURE fire counts ─────────────
    const timeBasedRawVolume = Math.max(1, time * 10);
    for (const df of DERIVED_FEATURES) {
      for (const src of df.sources) {
        const k = `${src}:${df.id}`;
        edgeFireCounts[k] = (edgeFireCounts[k] || 0) + timeBasedRawVolume * 0.08;
      }
      for (const evId of df.feeds) {
        const k = `${df.id}:${evId}`;
        const relevantEvents = rawEvents.filter(e => classifyEvent(e).some(s => s.id === evId)).length;
        edgeFireCounts[k] = (edgeFireCounts[k] || 0) + relevantEvents * 0.5;
      }
    }
    // ─── SKILL → L1 edge fire counts: boost from raw input volume ─────────────
    for (const edge of SUBSKILL_LAYER_EDGES) {
      if (edge[1] === "L1" && edge[2] >= 0.3) {
        const k = `${edge[0]}:L1`;
        edgeFireCounts[k] = (edgeFireCounts[k] || 0) + timeBasedRawVolume * 0.04;
      }
    }
    // ─── HEAVY EVENT boost cascades through skills ─────────────
    for (const sEdge of EVENT_SKILL_EDGES) {
      if (HEAVY_EVENTS.has(sEdge[0])) {
        const sk = `${sEdge[0]}:${sEdge[1]}`;
        edgeFireCounts[sk] = (edgeFireCounts[sk] || 0) + timeBasedRawVolume * 0.06;
      }
    }
    // ─── EVENT → SUB-SKILL edge fire counts (independent per sub-skill) ─────────────
    for (const edge of EVENT_SUBSKILL_EDGES) {
      const k = `${edge[0]}:${edge[1]}`;
      const eventFires = rawEvents.filter(e => classifyEvent(e).some(s => s.id === edge[0])).length;
      edgeFireCounts[k] = (edgeFireCounts[k] || 0) + eventFires * (edge[2] || 1) * 0.8;
    }
    // ─── EVENT → SKILL edge fire counts ─────────────
    for (const edge of EVENT_SKILL_EDGES) {
      const k = `${edge[0]}:${edge[1]}`;
      const eventFires = rawEvents.filter(e => classifyEvent(e).some(s => s.id === edge[0])).length;
      edgeFireCounts[k] = (edgeFireCounts[k] || 0) + eventFires * (edge[2] || 1) * 0.6;
    }
    // ─── RANDOM FIRE: ALL game events → ALL biology skills at half firehose speed ─────────────
    // Fire counts ALWAYS accumulate (for final pathway myelination)
    // Propagation arrivals ONLY during playback (for visual flicker)
    // GATE: biology skills only fire AFTER game events have populated (left→right cascade)
    const MOVEMENT_EVENTS = new Set(["ev_wasd", "ev_mouseFollow", "ev_waypoint"]);
    const movementEdgeKeys = new Set(); // track for blue coloring in renderer
    const activeEventCount = TREE_EVENTS.filter(ev => propArrival[ev.id] !== undefined && propArrival[ev.id] > -900).length;
    if (COL_RAMP.events > 0 && activeEventCount >= 2) {
      const HALF_PRIMES = [14, 22, 26, 34, 38, 46, 58, 62, 74, 82, 86, 94, 106, 118, 122, 134, 142, 146, 158, 166, 178];

      // First pass: determine which skills are "active" from non-movement events
      const skillActivity = {};
      TREE_SKILLS.forEach(sk => {
        skillActivity[sk.id] = 0;
      });

      // Non-movement events fire normally to all skills (gated by per-skill ramp)
      TREE_EVENTS.forEach((ev, ei) => {
        if (MOVEMENT_EVENTS.has(ev.id)) return;
        TREE_SKILLS.forEach((sk, si) => {
          // Per-skill ramp: virus lights with events, others ramp 5-30s
          const skRamp = COL_RAMP[SKILL_TO_COL[sk.id] || "bioVirus"] || 0;
          if (skRamp <= 0) return;
          const pairIdx = ei * TREE_SKILLS.length + si;
          const period = HALF_PRIMES[pairIdx % HALF_PRIMES.length];
          const cycle = Math.floor(nowMs / period);
          const phase = (ev.id.length * 17 + sk.id.length * 31 + pairIdx * 7) % 13;
          if ((cycle + phase) % 9 < 5) {
            const k = `${ev.id}:${sk.id}`;
            edgeFireCounts[k] = (edgeFireCounts[k] || 0) + 2 * skRamp;
            if (playing) {
              propArrival[sk.id] = Math.max(propArrival[sk.id] || -999, time - 0.8);
              propArrival[ev.id] = Math.max(propArrival[ev.id] || -999, time - 0.1);
            }
            skillActivity[sk.id] = (skillActivity[sk.id] || 0) + 2 * skRamp;
          }
        });
      });

      // Identify active skills
      const activeSkills = TREE_SKILLS.filter(sk => skillActivity[sk.id] > 3);
      const hasActive = activeSkills.length > 0;

      // Movement events: fire RAPIDLY to active cells at 50%, or any cell at 30%
      TREE_EVENTS.forEach((ev, ei) => {
        if (!MOVEMENT_EVENTS.has(ev.id)) return;
        const movPrimes = [11, 17, 23, 29, 37];
        TREE_SKILLS.forEach((sk, si) => {
          const skRamp = COL_RAMP[SKILL_TO_COL[sk.id] || "bioVirus"] || 0;
          if (skRamp <= 0) return;
          const pairIdx = ei * TREE_SKILLS.length + si;
          const period = movPrimes[pairIdx % movPrimes.length];
          const cycle = Math.floor(nowMs / period);
          const phase = (ev.id.length * 7 + sk.id.length * 19 + pairIdx * 3) % 7;
          const isActive = hasActive && activeSkills.some(a => a.id === sk.id);
          const duty = hasActive ? isActive ? 5 : 0 : 3;
          if ((cycle + phase) % 9 < duty) {
            const k = `${ev.id}:${sk.id}`;
            const brightness = isActive || !hasActive ? hasActive ? 5 : 3 : 0;
            edgeFireCounts[k] = (edgeFireCounts[k] || 0) + brightness * skRamp;
            if (playing) {
              propArrival[sk.id] = Math.max(propArrival[sk.id] || -999, time - 0.8);
              propArrival[ev.id] = Math.max(propArrival[ev.id] || -999, time - 0.08);
            }
            movementEdgeKeys.add(k);
          }
        });
      });

      // Sub-skill edges for all events
      TREE_EVENTS.forEach((ev, ei) => {
        TREE_SUB_SKILLS.forEach((ss, si) => {
          const pairIdx = ei * TREE_SUB_SKILLS.length + si;
          const period = HALF_PRIMES[(pairIdx + 3) % HALF_PRIMES.length];
          const cycle = Math.floor(nowMs / period);
          const phase = (ev.id.length * 13 + ss.id.length * 29 + pairIdx * 11) % 11;
          if ((cycle + phase) % 9 < 4) {
            const k = `${ev.id}:${ss.id}`;
            edgeFireCounts[k] = (edgeFireCounts[k] || 0) + 1.5;
            if (playing) {
              propArrival[ss.id] = Math.max(propArrival[ss.id] || -999, time - 0.9);
            }
            if (MOVEMENT_EVENTS.has(ev.id)) movementEdgeKeys.add(k);
          }
        });
      });
      // Cascade sub-skill fires into sub-skill→layer edges (always accumulate)
      SUBSKILL_LAYER_EDGES.forEach((edge, i) => {
        const k = `${edge[0]}:${edge[1]}`;
        // Check if this sub-skill has any fire count from any source
        const ssHasFire = Object.keys(edgeFireCounts).some(ek => ek.endsWith(`:${edge[0]}`) && edgeFireCounts[ek] > 0);
        if (ssHasFire) {
          edgeFireCounts[k] = (edgeFireCounts[k] || 0) + (edge[2] || 1) * 2;
          if (playing) {
            const ssArrival = propArrival[edge[0]];
            if (ssArrival !== undefined && ssArrival > -900 && time - ssArrival < 1.5) {
              propArrival[edge[1]] = Math.max(propArrival[edge[1]] || -999, ssArrival + PROP_DELAY * 0.5);
            }
          }
        }
      });
    }
    // ─── SKILL → LAYER edge fire counts (cascade from sub-skill activation) ─────────────
    for (const sEdge of EVENT_SUBSKILL_EDGES) {
      const sk = `${sEdge[0]}:${sEdge[1]}`;
      const sCount = edgeFireCounts[sk] || 0;
      if (sCount > 0) {
        for (const lEdge of SUBSKILL_LAYER_EDGES) {
          if (lEdge[0] === sEdge[1]) {
            const lk = `${lEdge[0]}:${lEdge[1]}`;
            edgeFireCounts[lk] = (edgeFireCounts[lk] || 0) + sCount * (lEdge[2] || 1) * 0.4;
          }
        }
      }
    }
    // ─── CASCADE: propagate counts through skill→layer→profile→career AFTER all boosts ─────────────
    for (const edge of SUBSKILL_LAYER_EDGES) {
      const k = `${edge[0]}:${edge[1]}`;
      const count = edgeFireCounts[k] || 0;
      if (count > 0) {
        for (const pe of LAYER_PROFILE_EDGES) {
          if (pe[0] === edge[1]) {
            const pk = `${pe[0]}:${pe[1]}`;
            const layerMult = LAYER_CAREER_WEIGHT[pe[0]] || 1;
            edgeFireCounts[pk] = (edgeFireCounts[pk] || 0) + count * (pe[2] || 1) * layerMult * 0.5;
          }
        }
      }
    }
    for (const edge of LAYER_PROFILE_EDGES) {
      const k = `${edge[0]}:${edge[1]}`;
      const count = edgeFireCounts[k] || 0;
      if (count > 0) {
        for (const ce of PROFILE_CAREER_EDGES) {
          if (ce[0] === edge[1]) {
            const ck = `${ce[0]}:${ce[1]}`;
            edgeFireCounts[ck] = (edgeFireCounts[ck] || 0) + count * (ce[2] || 1) * 0.3;
          }
        }
      }
    }
    const maxFireCount = Math.max(1, ...Object.values(edgeFireCounts));

    // ═══ UNIFIED BRIGHTNESS PIPELINE ═══
    // One system. Every edge and node gets brightness the same way.
    // Edge: stochastic flash (when source live) + myelin floor (from fire count)
    // Node: max(incoming edge brightnesses), capped by COL_RAMP
    // Rule: nothing downstream outshines its feeding pathway.
    const EDGE_PRIMES = [37, 41, 43, 47, 53, 59, 61, 67, 71, 73, 79, 83, 89, 97, 101, 103, 107, 109, 113];
    const edgeBright = {};
    const nodeBright = {};
    let _eIdx = 0;

    // Is a source currently live? (has signal flowing)
    const isLive = id => {
      if (dataTime < 2.0) return true; // warmup: everything live at start
      if (inputNodeFire[id] !== undefined) {
        return firehoseSet.has(id) || time - inputNodeFire[id] < 3.0;
      }
      const arr = propArrival[id];
      return arr !== undefined && arr > -900 && time - arr < 2.0;
    };

    // COL_RAMP ceiling for a destination node
    // ═══ COLUMN LOOKUP — maps any node ID to its COLUMNS key ═══
    const getDestColumn = toId => {
      if (DERIVED_FEATURES.some(d => d.id === toId)) return "extraction";
      if (TREE_EVENTS.some(n => n.id === toId)) return "events";
      const sk = TREE_SKILLS.find(n => n.id === toId);
      if (sk) return SKILL_TO_COL[sk.id] || "bioVirus";
      const ss = TREE_SUB_SKILLS.find(n => n.id === toId);
      if (ss) {
        const p = TREE_SKILLS.find(s => s.id === ss.parent);
        return p ? SKILL_TO_COL[p.id] || "bioVirus" : "bioVirus";
      }
      if (["L1", "L2", "L3", "L4"].includes(toId)) return "layers";
      if (TREE_PROFILES.some(n => n.id === toId)) return "profiles";
      if (TREE_CAREERS.some(n => n.id === toId)) return "careers";
      return "input";
    };
    const getDestRamp = toId => COL_RAMP[getDestColumn(toId)] || 0;
    const getSourceOutRamp = fromId => COL_OUT[getDestColumn(fromId)] || 0;
    const getNodeGate = nodeId => COL_NODE[getDestColumn(nodeId)] || 0;
    const getDestFlicker = toId => {
      const f = colConfig[getDestColumn(toId)]?.flicker ?? 5;
      return Math.max(0, Math.min(1, f / 10)); // 0-10 → 0.0-1.0
    };

    // Compute brightness for one edge
    const calcEdge = (fromId, toId) => {
      _eIdx++;
      const destRamp = getDestRamp(toId);
      if (destRamp <= 0) return 0;
      const sourceOut = getSourceOutRamp(fromId);
      if (sourceOut <= 0) return 0;
      // Edge brightness capped by the tighter of source-out and dest-in
      const edgeCap = Math.min(sourceOut, destRamp);
      const flicker = getDestFlicker(toId);
      const key = `${fromId}:${toId}`;
      const fireCount = edgeFireCounts[key] || 0;
      // Myelin floor: permanent trail, capped by ramp (builds over time)
      const myelin = fireCount > 0 ? Math.min(0.4 * edgeCap, 0.02 + fireCount * 0.005) : 0;
      // Stochastic flash vs steady glow — controlled by flicker setting
      let flash = 0;
      if (time > 0.1 && isLive(fromId)) {
        if (flicker > 0.05) {
          const period = EDGE_PRIMES[_eIdx % EDGE_PRIMES.length];
          const cycle = Math.floor(nowMs / period);
          const phase = (fromId.length * 17 + toId.length * 31 + _eIdx * 7) % 11;
          const duty = Math.max(1, Math.round(3 * edgeCap * flicker));
          if ((cycle + phase) % 7 < duty) flash = 0.15 + 0.45 * edgeCap;
        }
        const steady = (1 - flicker) * edgeCap * 0.6;
        flash = Math.max(flash, steady);
      }
      return Math.min(edgeCap, Math.max(flash, myelin));
    };

    // Compute ALL edge brightnesses — every edge in the system
    // Channel → Derived Feature
    INPUT_NODES.forEach(inp => {
      const dfIds = CHANNEL_TO_DF[inp.fireKey];
      if (dfIds) dfIds.forEach(dfId => {
        edgeBright[`${inp.fireKey}:${dfId}`] = calcEdge(inp.fireKey, dfId);
      });
    });
    // Channel → Event (transitive)
    INPUT_NODES.forEach(inp => {
      const evIds = CHANNEL_TO_EVENTS[inp.fireKey];
      if (evIds) evIds.forEach(evId => {
        edgeBright[`${inp.fireKey}:${evId}`] = calcEdge(inp.fireKey, evId);
      });
    });
    // Derived Feature → Event
    DERIVED_FEATURES.forEach(df => {
      df.feeds.forEach(evId => {
        edgeBright[`${df.id}:${evId}`] = calcEdge(df.id, evId);
      });
    });
    // All tree edges
    [...EVENT_SKILL_EDGES, ...EVENT_SUBSKILL_EDGES, ...SUBSKILL_LAYER_EDGES, ...LAYER_PROFILE_EDGES, ...PROFILE_CAREER_EDGES].forEach(edge => {
      edgeBright[`${edge[0]}:${edge[1]}`] = calcEdge(edge[0], edge[1]);
    });

    // Node brightness = max incoming edge brightness
    // No additional ceiling — edges already gate via duty cycle + destRamp on frequency
    for (const key of Object.keys(edgeBright)) {
      const sep = key.indexOf(":");
      const toId = key.substring(sep + 1);
      nodeBright[toId] = Math.max(nodeBright[toId] || 0, edgeBright[key]);
    }

    // ═══ FORWARD PROPAGATION ENFORCEMENT ═══
    // Rule: if a node is lit, its outgoing edges must carry signal at least as bright.
    // Signal flows left→right: event→skill→layer→profile→career
    // Each pass: outgoing edge brightness = max(current, min(sourceNode * edgeWeight, destRamp))
    // destRamp acts as a CAP (emergence ceiling), not a multiplier.
    // Then recompute nodeBright from the updated edges.

    // Seed input channel nodes — they have no incoming edges, so nodeBright is never set.
    // Use firehose activity + recent fire as brightness source.
    if (time > 0.1) {
      INPUT_NODES.forEach(inp => {
        const inFirehose = firehoseSet.has(inp.fireKey);
        const lastFire = inputNodeFire[inp.fireKey] !== undefined ? inputNodeFire[inp.fireKey] : -999;
        const age = time - lastFire;
        const recentFire = age >= 0 && age < 3.0;
        if (inFirehose || recentFire) {
          const bright = inFirehose ? Math.max(0.4, COL_RAMP.data) : Math.max(0.15, 0.4 * Math.exp(-age * 0.5));
          nodeBright[inp.fireKey] = Math.max(nodeBright[inp.fireKey] || 0, bright);
        }
      });
      // Seed extraction EDGES — brightness flows through edges, never directly to nodes.
      // If a channel is active and extraction ramp is on, seed the channel→DF edges.
      if (COL_RAMP.extraction > 0) {
        DERIVED_FEATURES.forEach(df => {
          df.sources.forEach(s => {
            const srcBright = nodeBright[s] || 0;
            if (srcBright < 0.03) return;
            const sourceOut = COL_OUT[getDestColumn(s)] || 0;
            if (sourceOut < 0.02) return;
            const key = `${s}:${df.id}`;
            const seeded = Math.min(srcBright, sourceOut, COL_RAMP.extraction);
            edgeBright[key] = Math.max(edgeBright[key] || 0, seeded);
            // Node brightness follows from edge
            nodeBright[df.id] = Math.max(nodeBright[df.id] || 0, seeded);
          });
        });
      }
    }
    const ALL_TREE_EDGES = [...EVENT_SUBSKILL_EDGES, ...EVENT_SKILL_EDGES, ...SUBSKILL_LAYER_EDGES, ...LAYER_PROFILE_EDGES, ...PROFILE_CAREER_EDGES];
    for (const edge of ALL_TREE_EDGES) {
      const fromId = edge[0],
        toId = edge[1],
        w = edge[2] || 1.0;
      const fromBright = nodeBright[fromId] || 0;
      if (fromBright < 0.03) continue;
      const destRamp = getDestRamp(toId);
      const sourceOut = getSourceOutRamp(fromId);
      const edgeCap = Math.min(sourceOut, destRamp);
      if (edgeCap < 0.02) continue;
      const key = `${fromId}:${toId}`;
      const propagated = Math.min(fromBright * w, edgeCap);
      edgeBright[key] = Math.max(edgeBright[key] || 0, propagated);
    }
    // Also propagate through channel→DF and DF→event edges
    INPUT_NODES.forEach(inp => {
      const fromBright = nodeBright[inp.fireKey] || 0;
      if (fromBright < 0.03) return;
      const sourceOut = getSourceOutRamp(inp.fireKey);
      if (sourceOut < 0.02) return;
      const dfIds = CHANNEL_TO_DF[inp.fireKey];
      if (dfIds) dfIds.forEach(dfId => {
        const destRamp = getDestRamp(dfId);
        if (destRamp < 0.02) return;
        const key = `${inp.fireKey}:${dfId}`;
        edgeBright[key] = Math.max(edgeBright[key] || 0, Math.min(fromBright, sourceOut, destRamp));
      });
      const evIds = CHANNEL_TO_EVENTS[inp.fireKey];
      if (evIds) evIds.forEach(evId => {
        const destRamp = getDestRamp(evId);
        if (destRamp < 0.02) return;
        const key = `${inp.fireKey}:${evId}`;
        edgeBright[key] = Math.max(edgeBright[key] || 0, Math.min(fromBright, sourceOut, destRamp));
      });
    });
    DERIVED_FEATURES.forEach(df => {
      const fromBright = nodeBright[df.id] || 0;
      if (fromBright < 0.03) return;
      const sourceOut = getSourceOutRamp(df.id);
      if (sourceOut < 0.02) return;
      df.feeds.forEach(evId => {
        const destRamp = getDestRamp(evId);
        if (destRamp < 0.02) return;
        const key = `${df.id}:${evId}`;
        edgeBright[key] = Math.max(edgeBright[key] || 0, Math.min(fromBright, sourceOut, destRamp));
      });
    });
    // Recompute nodeBright after forward propagation
    for (const key of Object.keys(edgeBright)) {
      const sep = key.indexOf(":");
      const toId = key.substring(sep + 1);
      nodeBright[toId] = Math.max(nodeBright[toId] || 0, edgeBright[key]);
    }

    // ═══ PARENT SKILL BRIGHTNESS — engagement-weighted, not flat max ═══
    // Each skill's brightness reflects how much the player engaged with that cell type.
    // Sum child sub-skill fire counts → normalize across skills → differentiated brightness.
    const skillEngagement = {};
    let maxSkillEngagement = 1;
    for (const sk of TREE_SKILLS) {
      const children = TREE_SUB_SKILLS.filter(ss => ss.parent === sk.id);
      let totalFires = 0;
      for (const child of children) {
        for (const edge of EVENT_SUBSKILL_EDGES) {
          if (edge[1] === child.id) {
            totalFires += edgeFireCounts[`${edge[0]}:${edge[1]}`] || 0;
          }
        }
      }
      skillEngagement[sk.id] = totalFires;
      if (totalFires > maxSkillEngagement) maxSkillEngagement = totalFires;
    }
    for (const sk of TREE_SKILLS) {
      const children = TREE_SUB_SKILLS.filter(ss => ss.parent === sk.id);
      const engagement = skillEngagement[sk.id] / maxSkillEngagement; // 0→1 relative
      // Sympathetic flash: when any child sub-skill is bright, parent gets a proportional bump
      const maxChildBright = Math.max(0, ...children.map(c => nodeBright[c.id] || 0));
      const sympatheticBump = maxChildBright * 1.0; // parent tracks child peak directly
      // Base brightness from engagement level (dim for unused, bright for heavily used)
      const engagementFloor = engagement * 0.35; // steady glow proportional to use
      const finalBright = Math.max(engagementFloor, sympatheticBump, nodeBright[sk.id] || 0);
      nodeBright[sk.id] = finalBright;
    }

    // ═══ FINAL PATHWAY — when stopped, ALL fired chains remain highlighted ═══
    // Full trace: channel → derived feature → event → skill → layer → profile → career
    // Brightness proportional to fire count relative to max
    const finalPathway = new Set(); // set of "fromId:toId" edge keys + node IDs
    const finalStrength = {}; // node/edge → 0-1 strength for brightness scaling
    if (time > 2) {
      // Find max fire count for normalization (across ALL edge types)
      let maxELFire = 1;
      for (const edge of SUBSKILL_LAYER_EDGES) {
        const k = `${edge[0]}:${edge[1]}`;
        const c = edgeFireCounts[k] || 0;
        if (c > maxELFire) maxELFire = c;
      }
      for (const edge of EVENT_SKILL_EDGES) {
        const k = `${edge[0]}:${edge[1]}`;
        const c = edgeFireCounts[k] || 0;
        if (c > maxELFire) maxELFire = c;
      }
      for (const edge of LAYER_PROFILE_EDGES) {
        const k = `${edge[0]}:${edge[1]}`;
        const c = edgeFireCounts[k] || 0;
        if (c > maxELFire) maxELFire = c;
      }
      // Trace EVERY skill→layer edge that fired
      for (const edge of SUBSKILL_LAYER_EDGES) {
        const k = `${edge[0]}:${edge[1]}`;
        const c = edgeFireCounts[k] || 0;
        if (c < 1) continue;
        const strength = Math.max(0.15, c / maxELFire);
        finalPathway.add(k);
        finalStrength[k] = Math.max(finalStrength[k] || 0, strength);
        finalPathway.add(edge[0]); // skill node
        finalStrength[edge[0]] = Math.max(finalStrength[edge[0]] || 0, strength);
        finalPathway.add(edge[1]); // layer node
        finalStrength[edge[1]] = Math.max(finalStrength[edge[1]] || 0, strength);
      }
      // Trace EVERY event→skill edge that fired (MUST run before DF trace so events are in finalPathway)
      for (const edge of EVENT_SKILL_EDGES) {
        const k = `${edge[0]}:${edge[1]}`;
        const c = edgeFireCounts[k] || 0;
        if (c < 1) continue;
        const strength = Math.max(0.15, c / maxELFire);
        finalPathway.add(k);
        finalStrength[k] = Math.max(finalStrength[k] || 0, strength);
        finalPathway.add(edge[0]); // event node — was missing!
        finalStrength[edge[0]] = Math.max(finalStrength[edge[0]] || 0, strength);
        finalPathway.add(edge[1]); // skill node
        finalStrength[edge[1]] = Math.max(finalStrength[edge[1]] || 0, strength);
      }
      // Trace backwards: derived features → events
      // If event is already in finalPathway (from event→skill trace), light ALL its feeding DFs + channels
      // Extraction brightness matches DATA layer — no attenuation
      for (const df of DERIVED_FEATURES) {
        for (const evId of df.feeds) {
          const evInFinal = finalPathway.has(evId);
          const k = `${df.id}:${evId}`;
          const c = edgeFireCounts[k] || 0;
          if (!evInFinal && c < 1) continue;
          const strength = evInFinal ? Math.max(0.2, finalStrength[evId] || 0.2) : Math.max(0.15, c / maxELFire);
          finalPathway.add(k);
          finalStrength[k] = Math.max(finalStrength[k] || 0, strength);
          finalPathway.add(df.id);
          finalStrength[df.id] = Math.max(finalStrength[df.id] || 0, strength);
          finalPathway.add(evId);
          finalStrength[evId] = Math.max(finalStrength[evId] || 0, strength);
          // Trace channels → derived features — same brightness as event
          for (const src of df.sources) {
            const ck = `${src}:${df.id}`;
            const cc = edgeFireCounts[ck] || 0;
            const srcStrength = cc > 0 ? Math.max(strength, cc / maxELFire) : strength;
            finalPathway.add(ck);
            finalStrength[ck] = Math.max(finalStrength[ck] || 0, srcStrength);
            finalPathway.add(src);
            finalStrength[src] = Math.max(finalStrength[src] || 0, srcStrength);
          }
        }
      }
      // Trace skill→layer edges
      for (const edge of SUBSKILL_LAYER_EDGES) {
        const k = `${edge[0]}:${edge[1]}`;
        const c = edgeFireCounts[k] || 0;
        if (c < 1) continue;
        const strength = Math.max(0.15, c / maxELFire);
        finalPathway.add(k);
        finalStrength[k] = Math.max(finalStrength[k] || 0, strength);
        finalPathway.add(edge[0]); // skill node
        finalStrength[edge[0]] = Math.max(finalStrength[edge[0]] || 0, strength);
      }
      // Trace forwards: layer → profile → career (ALL that fired)
      // Progressive layer weighting: L4 > L3 > L2 > L1 career contribution
      for (const edge of LAYER_PROFILE_EDGES) {
        const k = `${edge[0]}:${edge[1]}`;
        const c = edgeFireCounts[k] || 0;
        if (c < 1) continue;
        const layerMult = LAYER_CAREER_WEIGHT[edge[0]] || 1;
        const strength = Math.max(0.15, Math.min(1.0, c / maxELFire * layerMult));
        finalPathway.add(k);
        finalStrength[k] = Math.max(finalStrength[k] || 0, strength);
        finalPathway.add(edge[1]);
        finalStrength[edge[1]] = Math.max(finalStrength[edge[1]] || 0, strength);
      }
      for (const edge of PROFILE_CAREER_EDGES) {
        const k = `${edge[0]}:${edge[1]}`;
        const c = edgeFireCounts[k] || 0;
        if (c < 1) continue;
        const strength = Math.max(0.15, c / maxELFire);
        finalPathway.add(k);
        finalStrength[k] = Math.max(finalStrength[k] || 0, strength);
        finalPathway.add(edge[1]);
        finalStrength[edge[1]] = Math.max(finalStrength[edge[1]] || 0, strength);
      }
      // Rank profiles and careers — top 3 get boosted, rest dimmed
      const profileRanks = TREE_PROFILES.map(p => ({
        id: p.id,
        score: finalStrength[p.id] || 0
      })).sort((a, b) => b.score - a.score);
      const top3Profiles = new Set(profileRanks.slice(0, 3).filter(p => p.score > 0).map(p => p.id));
      const careerRanks = TREE_CAREERS.map(c => ({
        id: c.id,
        score: finalStrength[c.id] || 0
      })).sort((a, b) => b.score - a.score);
      const top3Careers = new Set(careerRanks.slice(0, 3).filter(c => c.score > 0).map(c => c.id));
      // Boost top 3, dim rest — top 3 should be clearly dominant
      for (const p of TREE_PROFILES) {
        if (top3Profiles.has(p.id)) {
          finalStrength[p.id] = Math.max(finalStrength[p.id] || 0, 0.85);
        } else if (finalStrength[p.id]) {
          finalStrength[p.id] = Math.min(finalStrength[p.id], 0.1);
        }
      }
      for (const c of TREE_CAREERS) {
        if (top3Careers.has(c.id)) {
          finalStrength[c.id] = Math.max(finalStrength[c.id] || 0, 0.85);
        } else if (finalStrength[c.id]) {
          finalStrength[c.id] = Math.min(finalStrength[c.id], 0.1);
        }
      }
      // Boost/dim edges to profiles and careers based on ranking
      for (const edge of LAYER_PROFILE_EDGES) {
        const k = `${edge[0]}:${edge[1]}`;
        if (!finalStrength[k]) continue;
        if (top3Profiles.has(edge[1])) {
          finalStrength[k] = Math.max(finalStrength[k], 0.7);
        } else {
          finalStrength[k] = Math.min(finalStrength[k], 0.08);
        }
      }
      for (const edge of PROFILE_CAREER_EDGES) {
        const k = `${edge[0]}:${edge[1]}`;
        if (!finalStrength[k]) continue;
        if (top3Careers.has(edge[1])) {
          // Any path feeding a top career gets boosted
          const boost = top3Profiles.has(edge[0]) ? 0.7 : 0.45;
          finalStrength[k] = Math.max(finalStrength[k], boost);
        } else {
          finalStrength[k] = Math.min(finalStrength[k], 0.08);
        }
      }
      // ─── WIN STATE: at 70% brightness in final pathway (40% brighter) ─────────────
      finalPathway.add("sk_win");
      finalStrength["sk_win"] = Math.max(finalStrength["sk_win"] || 0, 0.7);
      for (const ss of TREE_SUB_SKILLS) {
        if (ss.parent === "sk_win") {
          finalPathway.add(ss.id);
          finalStrength[ss.id] = Math.max(finalStrength[ss.id] || 0, 0.7);
        }
      }
      // Also boost event→win and win subskill→layer edges
      for (const edge of EVENT_SKILL_EDGES) {
        if (edge[1] === "sk_win") {
          const k = `${edge[0]}:${edge[1]}`;
          if (edgeFireCounts[k] > 0) {
            finalPathway.add(k);
            finalStrength[k] = Math.max(finalStrength[k] || 0, 0.55);
          }
        }
      }
      for (const edge of SUBSKILL_LAYER_EDGES) {
        if (edge[0].startsWith("ss_w_")) {
          const k = `${edge[0]}:${edge[1]}`;
          if (edgeFireCounts[k] > 0) {
            finalPathway.add(k);
            finalStrength[k] = Math.max(finalStrength[k] || 0, 0.5);
          }
        }
      }
    }
    const isFinalEdge = (fromId, toId) => finalPathway.has(`${fromId}:${toId}`);
    const isFinalNode = id => finalPathway.has(id);
    const getFinalStrength = key => finalStrength[key] || 0;

    // ═══ OVERRIDE final strength for parent skill nodes with engagement ═══
    // Cells the player used heavily stay bright; cells barely used dim to near-zero.
    for (const sk of TREE_SKILLS) {
      const engagement = skillEngagement[sk.id] / maxSkillEngagement; // 0→1
      finalPathway.add(sk.id);
      // Top cell → 1.0, lowest → 0.08. Clear visual separation.
      finalStrength[sk.id] = 0.08 + engagement * 0.92;
    }
    // Win State: always bright at end — victory condition, should stand out
    finalStrength["sk_win"] = Math.max(finalStrength["sk_win"] || 0, 0.85);
    // Mycobacterium: boost minimum so it reads clearly even if underplayed
    finalStrength["sk_myco"] = Math.max(finalStrength["sk_myco"] || 0, 0.65);

    // Apply final pathway floors to unified maps (only when demo nearly ended)
    for (const key of finalPathway) {
      if (key.includes(":")) {
        // Edge
        const ramp = getDestRamp(key.substring(key.indexOf(":") + 1));
        if (ramp > 0.8) edgeBright[key] = Math.max(edgeBright[key] || 0, (finalStrength[key] || 0) * 0.7);
      } else {
        // Node
        const ramp = getDestRamp(key);
        if (ramp > 0.8) nodeBright[key] = Math.max(nodeBright[key] || 0, (finalStrength[key] || 0) * 0.7);
      }
    }

    // ═══ MAX INCOMING EDGE BRIGHTNESS PER NODE ═══
    // If pathways are flowing into a node, it should glow dimly even before nodeOn.
    const maxInEdge = {};
    for (const key of Object.keys(edgeBright)) {
      const sep = key.indexOf(":");
      const toId = key.substring(sep + 1);
      const val = edgeBright[key] || 0;
      if (val > (maxInEdge[toId] || 0)) maxInEdge[toId] = val;
    }

    // ═══ GRAYSCALE HELPERS — pre-nodeOn nodes are gray, color fades in with nodeGate ═══
    const hexC = (h, i) => parseInt(h.slice(i, i + 2), 16);
    const grayLum = (r, g, b) => 150; // uniform gray — all nodes same brightness at baseBright
    const mixRGB = (r, g, b, colorMix) => {
      const gr = grayLum(r, g, b);
      return [Math.round(gr + (r - gr) * colorMix), Math.round(gr + (g - gr) * colorMix), Math.round(gr + (b - gr) * colorMix)];
    };

    // Sub-skill channel dimensions (matching data channel size)
    const ssW = 48,
      ssH = 14,
      ssGap = 1,
      ssXGap = 3;
    const renderEdges = (edges, fromNodes, toNodes, fromType, toType) => {
      return edges.map((edge, i) => {
        const fromId = edge[0],
          toId = edge[1],
          edgeWeight = edge[2] || 1.0;
