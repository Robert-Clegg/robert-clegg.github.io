<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Petro Active: Airbase</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; }
    
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
    }
    
    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    
    /* HUD overlay */
    #hud-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      font-family: 'Courier New', monospace;
      color: #00ffaa;
    }
    
    #hud-overlay > * {
      pointer-events: auto;
    }
    
    /* Status bar — top */
    #status-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 48px;
      background: rgba(0, 10, 20, 0.85);
      border-bottom: 1px solid rgba(0, 255, 170, 0.3);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      font-size: 14px;
    }
    
    .status-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .status-label { color: rgba(0, 255, 170, 0.5); font-size: 11px; text-transform: uppercase; }
    .status-value { color: #00ffaa; font-weight: bold; }
    .phase-indicator { color: #ff8844; font-size: 16px; letter-spacing: 2px; }
    
    /* Radar panel — upper left */
    #radar-panel {
      position: absolute;
      top: 60px;
      left: 12px;
      width: 280px;
      background: rgba(0, 10, 20, 0.9);
      border: 1px solid rgba(0, 255, 170, 0.3);
      border-radius: 4px;
      padding: 8px;
    }
    
    .panel-title {
      font-size: 11px;
      color: rgba(0, 255, 170, 0.6);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }
    
    /* Equipment panel — bottom left */
    #equipment-panel {
      position: absolute;
      bottom: 12px;
      left: 12px;
      width: 200px;
      background: rgba(0, 10, 20, 0.9);
      border: 1px solid rgba(0, 255, 170, 0.3);
      border-radius: 4px;
      padding: 8px;
    }
    
    .equipment-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 4px;
      border-bottom: 1px solid rgba(0, 255, 170, 0.1);
      font-size: 12px;
      cursor: pointer;
    }
    
    .equipment-item:hover { background: rgba(0, 255, 170, 0.1); }
    .equipment-item.selected { background: rgba(0, 255, 170, 0.2); border-left: 3px solid #00ffaa; }
    .equipment-count { color: #ff8844; }
    
    /* Compass / info — bottom right */
    #info-panel {
      position: absolute;
      bottom: 12px;
      right: 12px;
      width: 200px;
      background: rgba(0, 10, 20, 0.9);
      border: 1px solid rgba(0, 255, 170, 0.3);
      border-radius: 4px;
      padding: 8px;
      font-size: 12px;
    }
    
    /* Loading screen */
    #loading {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #0a0a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #00ffaa;
      font-family: 'Courier New', monospace;
      z-index: 100;
    }
    
    #loading h1 {
      font-size: 28px;
      letter-spacing: 4px;
      margin-bottom: 8px;
      color: #ff8844;
    }
    
    #loading p {
      font-size: 13px;
      color: rgba(0, 255, 170, 0.6);
    }
  </style>
  <script type="module" crossorigin src="/petro-active/assets/airbase-B5-ql0AI.js"></script>
  <link rel="modulepreload" crossorigin href="/petro-active/assets/ProceduralWalker-QlXkYlXm.js">
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
    
    <div id="hud-overlay">
      <!-- Status bar -->
      <div id="status-bar">
        <div class="status-item">
          <span class="phase-indicator" id="phase-display">AIRBASE</span>
        </div>
        <div class="status-item">
          <span class="status-label">Scene</span>
          <span class="status-value">Military Base</span>
        </div>
        <div class="status-item">
          <span class="status-label">Speed</span>
          <span class="status-value" id="speed-display">0 KPH</span>
        </div>
      </div>
      
      <!-- Radar panel (upper left) -->
      <div id="radar-panel">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;">
          <span class="panel-title" style="margin:0;">RADAR</span>
          <div style="display:flex; gap:3px; align-items:center;">
            <button id="radar-zoom-out" class="filter-btn" style="font-size:12px; padding:1px 8px; line-height:1; background:rgba(0,255,170,0.1); border:1px solid rgba(0,255,170,0.3); color:#00ffaa; cursor:pointer; font-family:'Courier New',monospace;">−</button>
            <span id="radar-zoom-label" style="color:#00ffaa; font-size:10px; font-family:'Courier New',monospace; min-width:24px; text-align:center;">9×</span>
            <button id="radar-zoom-in" class="filter-btn" style="font-size:12px; padding:1px 8px; line-height:1; background:rgba(0,255,170,0.1); border:1px solid rgba(0,255,170,0.3); color:#00ffaa; cursor:pointer; font-family:'Courier New',monospace;">+</button>
          </div>
        </div>
        <canvas id="radar-canvas" style="width:100%; height:200px; background:#050510; border:1px solid rgba(0,255,170,0.2);"></canvas>
      </div>
      
      <!-- Equipment panel (bottom left) -->
      <div id="equipment-panel">
        <div class="panel-title">Equipment</div>
        <div class="equipment-item selected" data-tool="geophone">
          <span>Geophone</span>
          <span class="equipment-count">×6</span>
        </div>
        <div class="equipment-item" data-tool="source">
          <span>Vibroseis Src</span>
          <span class="equipment-count">×3</span>
        </div>
        <div class="equipment-item" data-tool="core">
          <span>Core Sample</span>
          <span class="equipment-count">×2</span>
        </div>
        <div class="equipment-item" data-tool="drill">
          <span>Drill Target</span>
          <span class="equipment-count">×1</span>
        </div>
      </div>
      
      <!-- Info panel (bottom right) -->
      <div id="info-panel">
        <div class="panel-title">Position</div>
        <div id="pos-display" style="color: #00ffaa;">X: 0 Z: 0</div>
        <div id="terrain-display" style="color: #88ccaa; margin-top: 4px;">Elevation: 0m</div>
      </div>
      
    </div>
    
    <!-- Loading screen -->
    <div id="loading">
      <h1>PETRO ACTIVE</h1>
      <p>Airbase Scene — Loading Unity-exported buildings...</p>
    </div>
  </div>
  
</body>
</html>
